openapi: 3.1.0
info:
  title: NirogPath API
  version: 1.0.0
  description: |
    REST API for the **NirogPath Healthcare & OPD Prescription Hub Platform**.
    A comprehensive healthcare management system supporting Patients, Doctors, Clinic Receptionists, and Superuser Admins.
    
    ## Authentication & Security
    Protected endpoints require a HTTP Bearer JWT token passed in the `Authorization` header:
    `Authorization: Bearer <jwt_token>`
    
    Tokens are obtained by authenticating via `POST /api/auth/login` or `POST /api/auth/register`.
    
    ## System Roles & Access Control Matrix
    - **patient**: Browse doctors/hospitals, book consultation slots, pay token deposit via wallet, track live OPD queue position, view e-prescriptions, log daily medication doses, manage family profiles, and ask prescription follow-up questions.
    - **doctor**: Access doctor queue, advance consultation state (`call-next`, `complete`), broadcast running late warnings, set location & availability schedules, write e-prescriptions, reply to patient prescription queries.
    - **receptionist**: Clinic-wide aggregated metrics across doctors, hospital map uploads, walk-in token creation, and patient transfer management.
    - **admin**: Superuser operations — register doctors, create partner hospitals, manage users, and view hospital analytics.
    
    ## User Story Mapping
    | User Story ID | Role | Description | API Endpoints |
    |---|---|---|---|
    | **US-P1** | Patient | Register account with initial ₹2000 wallet credit | `POST /api/auth/register` |
    | **US-P2** | Patient | Authenticate & retrieve profile | `POST /api/auth/login`, `GET /api/auth/me` |
    | **US-P3** | Patient | Browse doctor directory & filter by specialty/rating | `GET /api/doctors`, `GET /api/search/doctors` |
    | **US-P4** | Patient | Browse hospital directory & affiliated doctors | `GET /api/hospitals`, `GET /api/hospitals/{id}/doctors` |
    | **US-P5** | Patient | View doctor consultation slot availability | `GET /api/doctors/{id}/slots` |
    | **US-P6** | Patient | Book appointment slot with ₹200 token deposit | `POST /api/bookings` |
    | **US-P7** | Patient | View appointment history & track live OPD queue | `GET /api/bookings/me`, `GET /api/bookings/{id}/queue-position` |
    | **US-P8** | Patient | Arrive at clinic & cancel appointment with deposit refund | `POST /api/bookings/{id}/arrive`, `POST /api/bookings/{id}/cancel` |
    | **US-P9** | Patient | View e-prescriptions & print prescription payload | `GET /api/prescriptions/me`, `GET /api/prescriptions/{id}`, `GET /api/prescriptions/{id}/print-data` |
    | **US-P10** | Patient | View daily medicine alarm schedule & log doses | `GET /api/medicines/today`, `POST /api/medicines/take` |
    | **US-P11** | Patient | Manage family member profiles | `GET /api/family`, `POST /api/family`, `DELETE /api/family/{id}` |
    | **US-P12** | Patient | Ask prescription follow-up questions | `GET /api/prescriptions/{id}/messages`, `POST /api/prescriptions/{id}/messages` |
    | **US-D1** | Doctor | View token-ordered patient OPD queue | `GET /api/doctor/queue` |
    | **US-D2** | Doctor | Advance queue status (`call-next`, `complete`) | `POST /api/doctor/bookings/{id}/call-next`, `POST /api/doctor/bookings/{id}/complete` |
    | **US-D3** | Doctor | Set running late delay warning for queue | `POST /api/doctor/set-late` |
    | **US-D4** | Doctor | Write structured e-prescription (OD/BID/TID/QID) | `POST /api/doctor/bookings/{id}/prescription` |
    | **US-D5** | Doctor | Answer patient prescription follow-up questions | `GET /api/doctor/questions/unread`, `POST /api/prescriptions/{id}/messages` |
    | **US-R1** | Receptionist | View aggregate clinic statistics across doctors | `GET /api/reception/overview`, `GET /api/reception/analytics` |
    | **US-R2** | Receptionist | Generate offline walk-in patient token | `POST /api/reception/walkin` |
    | **US-R3** | Receptionist | Offer appointment transfer to faster queue | `GET /api/reception/transfer-candidates`, `POST /api/reception/offer-transfer` |
    | **US-A1** | Admin | Register new doctor with hospital association | `POST /api/admin/doctors` |
    | **US-A2** | Admin | Register new hospital with photo upload | `POST /api/admin/hospitals`, `PUT /api/admin/hospitals/{id}` |
    | **US-A3** | Admin | Manage system user accounts & view analytics | `GET /api/admin/users`, `GET /api/admin/hospitals/{id}/analytics` |
    | **US-M4-1** | Patient | AI Smart Doctor & Specialty Recommender (Sprint 2) | `POST /api/ai/recommend` |
    | **US-M4-2** | Doctor / Receptionist | OPD Queue Review Assistant (Sprint 2) | `GET /api/doctor/bookings/{booking_id}/review` |
    | **US-M4-3** | Patient / Doctor | RAG-Based AI Prescription Q&A Assistant (Sprint 2) | `POST /api/prescriptions/{id}/messages`, `GET /api/prescriptions/{id}/messages` |
    
    ## Error Handling Details
    The API follows standard HTTP status codes for error responses:
    - `HTTP 400 Bad Request`: Validation failure, invalid parameters, insufficient wallet balance, or invalid dosage frequency.
    - `HTTP 401 Unauthorized`: Missing or invalid Bearer JWT token.
    - `HTTP 403 Forbidden`: Role-Based Access Control (RBAC) failure or unauthorized resource access attempt.
    - `HTTP 404 Not Found`: Requested resource (Doctor, Hospital, Booking, Prescription) does not exist.
    - `HTTP 409 Conflict`: Slot already booked or conflicting operation.
    - `HTTP 422 Unprocessable Entity`: Request body failed Pydantic schema validation.
    - `HTTP 500 Internal Server Error`: Unexpected server or database exception.
